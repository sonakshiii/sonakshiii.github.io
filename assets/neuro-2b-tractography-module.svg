92.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.8" font-weight="500" fill="#E4E7EB" text-anchor="middle">0.5</text><rect x="114.3" y="87.5" width="17.025" height="7.5" rx="1.5" fill="#2A3138"/><text x="122.8" y="92.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.8" font-weight="500" fill="#E4E7EB" text-anchor="middle">0.5</text><rect x="132.925" y="87.5" width="17.025" height="7.5" rx="1.5" fill="#2A3138"/><text x="141.4" y="92.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.8" font-weight="500" fill="#E4E7EB" text-anchor="middle">0.5</text><rect x="151.55" y="87.5" width="17.025" height="7.5" rx="1.5" fill="#2A3138"/><text x="160.1" y="92.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.8" font-weight="500" fill="#E4E7EB" text-anchor="middle">0.5</text><rect x="170.175" y="87.5" width="17.025" height="7.5" rx="1.5" fill="#2A3138"/><text x="178.7" y="92.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.8" font-weight="500" fill="#E4E7EB" text-anchor="middle">0.5</text><rect x="18" y="99" width="176" height="9" rx="2.5" fill="#1B2228"/><circle cx="23.5" cy="103.5" r="1.8" fill="none" stroke="#F0D54A" stroke-width=".7"/><text x="28.0" y="104.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.8" font-weight="500" fill="#D5DBE1" text-anchor="start">Which measures indicate the condition of a tract</text><text x="191.0" y="104.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.8" font-weight="700" fill="#34D399" text-anchor="end">Learn more ›</text><rect x="12" y="121" width="188" height="20" rx="4" fill="#F5F7F9" stroke="#D5DBE1" stroke-width=".5"/><text x="18.0" y="128.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.9" font-weight="700" fill="#12856D" text-anchor="start">RADIOLOGIST’S IMPRESSION</text><text x="18.0" y="134.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.9" font-weight="500" fill="#9AA5B1" text-anchor="start" font-style="italic">To be filled by radiologist</text><rect x="209.2" y="15.6" width="80" height="20" rx="5" fill="#1F2933" fill-opacity=".06"/><rect x="208.6" y="14.6" width="79" height="19" rx="4" fill="#1F2933" fill-opacity=".09"/><rect x="208" y="12" width="80" height="20" rx="4" fill="#FFFFFF" stroke="#D5DBE1" stroke-width=".9"/><text x="214.0" y="20.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3" font-weight="600" fill="#1F2933" text-anchor="start">Tractography derived using dMRI</text><text x="214.0" y="27.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3" font-weight="700" fill="#12856D" text-anchor="start">Learn more ›</text><circle cx="58" cy="21.5" r="3" fill="#FFFFFF" stroke="#1F2933" stroke-width=".9"/><text x="58.0" y="22.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.1" font-weight="800" fill="#1F2933" text-anchor="middle">1</text><circle cx="212" cy="42" r="3" fill="#1F2933"/><text x="212.0" y="43.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.1" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="218.0" y="43.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="700" fill="#1F2933" text-anchor="start">Tract selector</text><text x="218.0" y="48.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.05" font-weight="500" fill="#52606D" text-anchor="start">One dropdown switches between tracts, so</text><text x="218.0" y="52.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.05" font-weight="500" fill="#52606D" text-anchor="start">the viewer stays in place.</text><circle cx="188" cy="45" r="3" fill="#FFFFFF" stroke="#1F2933" stroke-width=".9"/><text x="188.0" y="46.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.1" font-weight="800" fill="#1F2933" text-anchor="middle">2</text><circle cx="212" cy="61" r="3" fill="#1F2933"/><text x="212.0" y="62.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.1" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="218.0" y="62.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="700" fill="#1F2933" text-anchor="start">Two views</text><text x="218.0" y="67.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.05" font-weight="500" fill="#52606D" text-anchor="start">The selected tract appears in two brain</text><text x="218.0" y="71.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.05" font-weight="500" fill="#52606D" text-anchor="start">views, side by side.</text><circle cx="197" cy="82" r="3" fill="#FFFFFF" stroke="#1F2933" stroke-width=".9"/><text x="197.0" y="83.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.1" font-weight="800" fill="#1F2933" text-anchor="middle">3</text><circle cx="212" cy="80" r="3" fill="#1F2933"/><text x="212.0" y="81.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.1" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="218.0" y="81.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="700" fill="#1F2933" text-anchor="start">Measures by side</text><text x="218.0" y="86.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.05" font-weight="500" fill="#52606D" text-anchor="start">Left and right values sit in matching</text><text x="218.0" y="90.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.05" font-weight="500" fill="#52606D" text-anchor="start">rows, so differences are easy to spot.</text><circle cx="197" cy="131" r="3" fill="#FFFFFF" stroke="#1F2933" stroke-width=".9"/><text x="197.0" y="132.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.1" font-weight="800" fill="#1F2933" text-anchor="middle">4</text><circle cx="212" cy="99" r="3" fill="#1F2933"/><text x="212.0" y="100.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.1" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="218.0" y="100.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="700" fill="#1F2933" text-anchor="start">Impression below</text><text x="218.0" y="105.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.05" font-weight="500" fill="#52606D" text-anchor="start">The radiologist writes the</text><text x="218.0" y="109.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.05" font-weight="500" fill="#52606D" text-anchor="start">interpretation directly under the</text><text x="218.0" y="113.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.05" font-weight="500" fill="#52606D" text-anchor="start">evidence.</text>

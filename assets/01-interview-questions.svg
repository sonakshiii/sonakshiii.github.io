<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="648" viewBox="0 0 300 129.60000000000002">
<circle cx="18" cy="19" r="6" fill="#1F2933"/><text x="18.0" y="20.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4" font-weight="700" fill="#FFFFFF" text-anchor="middle">Me</text><path d="M28 13 h157.9 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-153.9 l-4 3 v-3 a4 4 0 0 1 -4 -4 v-6 a4 4 0 0 1 4 -4Z" fill="#1F2933"/><text x="34.0" y="21.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.6" font-weight="500" fill="#FFFFFF" text-anchor="start">I'm a PM intern here, and I want to learn how drones are used to create orthomosaics.</text><text x="288.0" y="21.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.2" font-weight="500" fill="#52606D" text-anchor="end">Master–apprentice sessions with GIS analysts</text><rect x="13.2" y="39.6" width="86.66666666666667" height="83.60000000000001" rx="7.2" fill="#1F2933" fill-opacity=".06"/><rect x="12.6" y="38.6" width="85.66666666666667" height="82.60000000000001" rx="6.2" fill="#1F2933" fill-opacity=".09"/><rect x="12.0" y="36" width="86.66666666666667" height="83.60000000000001" rx="6.2" fill="#E1F1FB" stroke="#E1F1FB" stroke-width=".9"/><circle cx="20.0" cy="45" r="3.2" fill="#2B8FCB"/><text x="26.0" y="46.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4" font-weight="700" fill="#1F6FA5" text-anchor="start">Learning the basics</text><path d="M21.0 54 h72.66666666666667 a3.5 3.5 0 0 1 3.5 3.5 v17.4 a3.5 3.5 0 0 1 -3.5 3.5 h-69.66666666666667 l-3.5 2.8 v-2.8 a3.5 3.5 0 0 1 -3.5 -3.5 v-17.4 a3.5 3.5 0 0 1 3.5 -3.5Z" fill="#FFFFFF"/><text x="23.5" y="60.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">“What is the difference between</text><text x="23.5" y="65.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">geotags and GCPs? How do they</text><text x="23.5" y="69.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">differ when stitching the images</text><text x="23.5" y="74.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">together?”</text><path d="M21.0 84.4 h72.66666666666667 a3.5 3.5 0 0 1 3.5 3.5 v12.799999999999997 a3.5 3.5 0 0 1 -3.5 3.5 h-69.66666666666667 l-3.5 2.8 v-2.8 a3.5 3.5 0 0 1 -3.5 -3.5 v-12.799999999999997 a3.5 3.5 0 0 1 3.5 -3.5Z" fill="#FFFFFF"/><text x="23.5" y="90.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">“What project are you working on</text><text x="23.5" y="95.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">right now, and how many images are</text><text x="23.5" y="100.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">used to create the maps?”</text><rect x="107.86666666666667" y="39.6" width="86.66666666666667" height="83.60000000000001" rx="7.2" fill="#1F2933" fill-opacity=".06"/><rect x="107.26666666666667" y="38.6" width="85.66666666666667" height="82.60000000000001" rx="6.2" fill="#1F2933" fill-opacity=".09"/><rect x="106.66666666666667" y="36" width="86.66666666666667" height="83.60000000000001" rx="6.2" fill="#E6E0FA" stroke="#E6E0FA" stroke-width=".9"/><circle cx="114.66666666666667" cy="45" r="3.2" fill="#8B7AD6"/><text x="120.7" y="46.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4" font-weight="700" fill="#5B4A9E" text-anchor="start">Walking the workflow</text><path d="M115.66666666666667 54 h72.66666666666667 a3.5 3.5 0 0 1 3.5 3.5 v12.799999999999997 a3.5 3.5 0 0 1 -3.5 3.5 h-69.66666666666667 l-3.5 2.8 v-2.8 a3.5 3.5 0 0 1 -3.5 -3.5 v-12.799999999999997 a3.5 3.5 0 0 1 3.5 -3.5Z" fill="#FFFFFF"/><text x="118.2" y="60.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">“Can you walk me through what</text><text x="118.2" y="65.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">happens after the drone survey is</text><text x="118.2" y="69.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">completed?”</text><path d="M115.66666666666667 79.8 h72.66666666666667 a3.5 3.5 0 0 1 3.5 3.5 v8.2 a3.5 3.5 0 0 1 -3.5 3.5 h-69.66666666666667 l-3.5 2.8 v-2.8 a3.5 3.5 0 0 1 -3.5 -3.5 v-8.2 a3.5 3.5 0 0 1 3.5 -3.5Z" fill="#FFFFFF"/><text x="118.2" y="86.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">“What tools do you use at each</text><text x="118.2" y="90.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">stage of the workflow?”</text><rect x="202.53333333333333" y="39.6" width="86.66666666666667" height="83.60000000000001" rx="7.2" fill="#1F2933" fill-opacity=".06"/><rect x="201.93333333333334" y="38.6" width="85.66666666666667" height="82.60000000000001" rx="6.2" fill="#1F2933" fill-opacity=".09"/><rect x="201.33333333333334" y="36" width="86.66666666666667" height="83.60000000000001" rx="6.2" fill="#FFE6CC" stroke="#FFE6CC" stroke-width=".9"/><circle cx="209.33333333333334" cy="45" r="3.2" fill="#E69F00"/><text x="215.3" y="46.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4" font-weight="700" fill="#9A5414" text-anchor="start">Finding decision points</text><path d="M210.33333333333334 54 h72.66666666666667 a3.5 3.5 0 0 1 3.5 3.5 v8.2 a3.5 3.5 0 0 1 -3.5 3.5 h-69.66666666666667 l-3.5 2.8 v-2.8 a3.5 3.5 0 0 1 -3.5 -3.5 v-8.2 a3.5 3.5 0 0 1 3.5 -3.5Z" fill="#FFFFFF"/><text x="212.8" y="60.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">“What are you checking before you</text><text x="212.8" y="65.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">move to the next step?”</text><path d="M210.33333333333334 75.2 h72.66666666666667 a3.5 3.5 0 0 1 3.5 3.5 v8.2 a3.5 3.5 0 0 1 -3.5 3.5 h-69.66666666666667 l-3.5 2.8 v-2.8 a3.5 3.5 0 0 1 -3.5 -3.5 v-8.2 a3.5 3.5 0 0 1 3.5 -3.5Z" fill="#FFFFFF"/><text x="212.8" y="81.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">“Where do you usually need to</text><text x="212.8" y="86.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">switch between tools?”</text><path d="M210.33333333333334 96.4 h72.66666666666667 a3.5 3.5 0 0 1 3.5 3.5 v8.2 a3.5 3.5 0 0 1 -3.5 3.5 h-69.66666666666667 l-3.5 2.8 v-2.8 a3.5 3.5 0 0 1 -3.5 -3.5 v-8.2 a3.5 3.5 0 0 1 3.5 -3.5Z" fill="#FFFFFF"/><text x="212.8" y="102.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">“What information do you rely on to</text><text x="212.8" y="107.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="500" fill="#1F2933" text-anchor="start">verify that an output is accurate?”</text>
</svg>